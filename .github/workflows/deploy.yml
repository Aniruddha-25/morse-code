name: Deploy to GitHub Pages

on:
  schedule:
    # 12:00 AM IST = 18:30 UTC on the previous day.
    # GitHub may start scheduled runs a few minutes late.
    - cron: '30 18 * * *'
  workflow_dispatch:

# Never run two deployments at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

# Each job below declares only the permissions it needs.
permissions: {}

jobs:
  # Scheduled runs deploy only if the default branch has a commit that was not
  # already deployed by a previous successful run. Manual runs always deploy.
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Compare HEAD with last successful deployment
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          EVENT: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run: always deploying."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_sha=$(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?branch=$BRANCH&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          echo "Current commit:         $CURRENT_SHA"
          echo "Last deployed commit:   ${last_sha:-none}"
          if [ "$last_sha" = "$CURRENT_SHA" ]; then
            echo "No new commits since the last successful deployment: skipping."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
